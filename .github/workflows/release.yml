name: Release macOS installers
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm test
      - name: Download verified ARM runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-runtime
          cd .release-runtime
          curl --fail --location --retry 3 -O https://nodejs.org/dist/v22.22.2/node-v22.22.2-darwin-arm64.tar.gz
          curl --fail --location --retry 3 -O https://nodejs.org/dist/v22.22.2/SHASUMS256.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          name = 'node-v22.22.2-darwin-arm64.tar.gz'
          expected = dict((line.split()[1], line.split()[0]) for line in Path('SHASUMS256.txt').read_text().splitlines())[name]
          assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected
          PY
          tar -xzf node-v22.22.2-darwin-arm64.tar.gz
      - name: Build installers
        run: python3 scripts/build_release.py --node "$PWD/.release-runtime/node-v22.22.2-darwin-arm64/bin/node" --node-license "$PWD/.release-runtime/node-v22.22.2-darwin-arm64/LICENSE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "AGY Token Tips $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
