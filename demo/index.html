<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tokens-tips · 独立指标插件预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#28282c;font:14px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:1000px;margin:60px auto;padding:24px}h1{font-size:32px;letter-spacing:-1px}p{color:#72727b}
.card{background:white;border:1px solid #dcdce2;border-radius:18px;padding:16px;max-width:100%}
.editor{height:120px;outline:none}.agy-composer-footer{display:flex;justify-content:space-between;align-items:center;gap:10px}
.left{display:flex;align-items:center;gap:8px;min-width:0}button{font:inherit;white-space:nowrap;border:0;border-radius:7px;padding:7px 10px;cursor:pointer}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}#results{white-space:pre-wrap;color:#237b50}
body.dark{background:#121318;color:#e5e5ea}body.dark .card{background:#1c1d22;border-color:#41424a}body.dark button{background:#34353d;color:inherit}
</style>
<main><h1>tokens-tips</h1><p>独立的 Antigravity 会话指标 · 以下是模拟数据，用于界面测试</p>
<div id="antigravity.agentSidePanelInputBox" class="card"><div class="editor" contenteditable="true">Ask Antigravity…</div>
<div class="agy-composer-footer"><div class="left"><button data-testid="model-selector-trigger">Gemini 3.1 Pro</button></div><button data-testid="send-button">↑</button></div></div>
<nav><button id="sample">显示模拟指标</button><button id="next">切换会话</button><button id="narrow">窄窗口布局</button><button id="dark">深色模式</button><button id="dispose">移除插件</button><button id="tests">运行界面测试</button></nav><pre id="results"></pre>
</main>
<script type="module" src="./demo.js"></script>
</html>
